# Configuração da análise — Missão (14) / Eleições Gerais 2026
ano: 2026
turno: 1
ano_comparacao: 2022           # eleição usada como base de "voto esperado" e origem dos votos

partido:
  sigla: MISSAO                # SG_PARTIDO nos arquivos do TSE (sem acento, como o TSE grava)
  numero: 14
  nome_exibicao: Missão

presidente:
  numero: 14                   # NR_CANDIDATO do Renan Santos
  nome_exibicao: Renan Santos

# Candidatos de referência 2022 para a regressão de "origem dos votos" (números de urna 2022)
referencia_2022:
  "13": Lula
  "22": Bolsonaro
  "12": Ciro
  "15": Tebet
  "30": "Felipe d'Avila"
  "44": Soraya

# Limiares usados nos rankings (evitam ruído de municípios minúsculos)
min_eleitores_ranking: 5000
faixas_eleitorado: [0, 5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000, 100000000]

# Cláusula de barreira (EC 97/2017, art. 3º) para a eleição de 2026: acesso ao Fundo Partidário e à
# propaganda gratuita em 2027–2030. Atinge quem cumprir UM dos critérios na eleição para a Câmara:
#   (a) % dos válidos no país, distribuídos em ≥ ufs_minimo UFs com ≥ pct_uf em cada; ou
#   (b) eleger ≥ deputados, distribuídos em ≥ ufs_minimo UFs.
# Em 2030 sobe para 3% / 2% por UF / 15 deputados.
clausula_barreira:
  pct_nacional: 2.5
  pct_uf: 1.5
  ufs_minimo: 9
  deputados: 13
  comparar_partidos: false     # true inclui a situação de todos os partidos e federações

# Fontes
fontes:
  cdn: https://cdn.tse.jus.br/estatistica/sead/odsele
  divulgacao: https://resultados.tse.jus.br/oficial
